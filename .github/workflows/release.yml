name: Package an explicitly selected example release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to package (for example 1.19.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate and package all language vaults
        run: python3 scripts/examples/package.py
      - name: Save packages for review
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-examples-${{ inputs.version }}
          path: dist/*.zip
